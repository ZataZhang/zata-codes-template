# -----------------------------------------------------------------------------
# Docker Compose — Dokploy Production Deployment
# -----------------------------------------------------------------------------
# Usage:
#   Deploy via Dokploy UI by pointing it to this compose file.
#
# Prerequisites:
#   1. Set DOMAIN in Dokploy environment (e.g. app.example.com).
#   2. Set DATABASE_URL to your production database.
#   3. Ensure "dokploy-network" exists (Dokploy creates it).
#
# Traefik labels route traffic to the admin frontend (Nginx). DOMAIN must be set in
# the Dokploy Compose environment; otherwise Docker Compose fails early instead
# of generating Host(``) routes that return Traefik 404.
#
# Backups, S3 diagnostics, and VPS provisioning have moved to the standalone
# `zata-ops` CLI; schedule `zata-ops db backup` externally (Dokploy Scheduled
# Job, cron, GitHub Actions, etc.).
# -----------------------------------------------------------------------------

# Dokploy 为每个 Compose 部署分配唯一项目名。只有前端连接共享的
# dokploy-network；后端只加入本项目的 backend-app 私有网络。
x-backend-network-alias: &backend-network-alias
  "${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}-backend"
x-backend-upstream: &backend-upstream
  "${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}-backend:8000"

services:
  zata-codes-template-backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    expose:
      - "8000"
    # Dokploy writes its Environment panel to a `.env` file next to this compose
    # file but does NOT inject it into containers. Load it wholesale so a new
    # setting only needs the Environment panel, not another edit here.
    # Keep the `environment` list below for documented defaults: an explicit
    # entry outranks env_file and would shadow the value from .env.
    # `required: false` keeps `docker compose config` working in a fresh
    # checkout, where .env is gitignored and absent.
    env_file:
      - path: .env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-*}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}
      - SECURITY_RATE_LIMIT_ENABLED=${SECURITY_RATE_LIMIT_ENABLED:-true}
      - OBSERVABILITY_METRICS_ENABLED=${OBSERVABILITY_METRICS_ENABLED:-false}
      - MCP_ENABLED=${MCP_ENABLED:-false}
      - AUTH_ADMIN_BOOTSTRAP_USERNAME
      - AUTH_ADMIN_BOOTSTRAP_PASSWORD
      - APP_BOOTSTRAP_EMAIL
      - APP_BOOTSTRAP_PASSWORD
      - MODEL_BASE_URL
      - MODEL_API_KEY
      - MODEL_NAME
      - E2B_API_KEY
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      - OTEL_EXPORTER_OTLP_ENDPOINT
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # 与 deploy/vps-traefik/docker-compose.yml 保持一致：Dokploy 路径同样有
      # 两个服务用 depends_on: service_healthy 等这个 backend，10s 窗口（实际
      # 预算约 70s）小于跑迁移 + seed 的真实启动耗时。
      start_period: 180s
    volumes:
      - zata-codes-template-backend-logs:/app/logs
      - zata-codes-template-backend-data:/app/data
    networks:
      backend-app:
        aliases:
          - *backend-network-alias
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "0.25"
          memory: 512M

  zata-codes-template-admin:
    build:
      # 上下文是仓库根：frontend-admin 是 pnpm workspace 成员，
      # pnpm-workspace.yaml 与 pnpm-lock.yaml 都在根目录。
      context: .
      dockerfile: frontend-admin/Dockerfile
    expose:
      - "80"
    depends_on:
      zata-codes-template-backend:
        condition: service_healthy
    environment:
      BACKEND_UPSTREAM: *backend-upstream
      API_MAX_BODY_SIZE: ${ADMIN_API_MAX_BODY_BYTES:-1048576}
    restart: unless-stopped
    networks:
      - dokploy-network
      - backend-app
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-admin-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-web.rule=Host(`admin.${DOMAIN:?Set DOMAIN in Dokploy environment}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-web.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-web.middlewares=${COMPOSE_PROJECT_NAME}-admin-https-redirect"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin.rule=Host(`admin.${DOMAIN:?Set DOMAIN in Dokploy environment}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-admin.loadbalancer.server.port=80"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-admin-api-rate.ratelimit.average=${ADMIN_API_RATE_LIMIT_AVERAGE:-60}"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-admin-api-rate.ratelimit.period=${ADMIN_API_RATE_LIMIT_PERIOD:-1m}"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-admin-api-rate.ratelimit.burst=${ADMIN_API_RATE_LIMIT_BURST:-20}"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-admin-api-rate.ratelimit.sourcecriterion.ipstrategy.depth=${TRAEFIK_CLIENT_IP_DEPTH:-0}"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-admin-api-inflight.inflightreq.amount=${ADMIN_API_MAX_INFLIGHT:-20}"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-admin-api-body.buffering.maxrequestbodybytes=${ADMIN_API_MAX_BODY_BYTES:-1048576}"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-admin-api-body.buffering.memrequestbodybytes=${ADMIN_API_MAX_BODY_BYTES:-1048576}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-api.rule=Host(`admin.${DOMAIN:?Set DOMAIN in Dokploy environment}`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-api.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-api.priority=100"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-api.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-api.middlewares=${COMPOSE_PROJECT_NAME}-admin-api-rate,${COMPOSE_PROJECT_NAME}-admin-api-inflight,${COMPOSE_PROJECT_NAME}-admin-api-body"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-admin-api.service=${COMPOSE_PROJECT_NAME}-admin"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.125"
          memory: 64M

  zata-codes-template-public:
    build:
      # 上下文是仓库根：frontend-public 是 pnpm workspace 成员，
      # pnpm-workspace.yaml 与 pnpm-lock.yaml 都在根目录。
      context: .
      dockerfile: frontend-public/Dockerfile
    expose:
      - "3000"
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}-backend:8000}
    depends_on:
      zata-codes-template-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dokploy-network
      - backend-app
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-public-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-public-web.rule=Host(`${DOMAIN:?Set DOMAIN in Dokploy environment}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-public-web.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-public-web.middlewares=${COMPOSE_PROJECT_NAME}-public-https-redirect"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-public.rule=Host(`${DOMAIN:?Set DOMAIN in Dokploy environment}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-public.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-public.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-public.tls.certresolver=letsencrypt"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-public.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-public-api-rate.ratelimit.average=${PUBLIC_API_RATE_LIMIT_AVERAGE:-120}"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-public-api-rate.ratelimit.period=${PUBLIC_API_RATE_LIMIT_PERIOD:-1m}"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-public-api-rate.ratelimit.burst=${PUBLIC_API_RATE_LIMIT_BURST:-60}"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-public-api-rate.ratelimit.sourcecriterion.ipstrategy.depth=${TRAEFIK_CLIENT_IP_DEPTH:-0}"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-public-api-inflight.inflightreq.amount=${PUBLIC_API_MAX_INFLIGHT:-40}"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-public-api-body.buffering.maxrequestbodybytes=${PUBLIC_API_MAX_BODY_BYTES:-1048576}"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-public-api-body.buffering.memrequestbodybytes=${PUBLIC_API_MAX_BODY_BYTES:-1048576}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-public-api.rule=Host(`${DOMAIN:?Set DOMAIN in Dokploy environment}`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-public-api.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-public-api.priority=100"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-public-api.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-public-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-public-api.middlewares=${COMPOSE_PROJECT_NAME}-public-api-rate,${COMPOSE_PROJECT_NAME}-public-api-inflight,${COMPOSE_PROJECT_NAME}-public-api-body"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-public-api.service=${COMPOSE_PROJECT_NAME}-public"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.125"
          memory: 64M

volumes:
  zata-codes-template-backend-logs:
  zata-codes-template-backend-data:

networks:
  backend-app: {}
  dokploy-network:
    external: true
