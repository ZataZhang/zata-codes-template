[[package]]
name = "zata-codes-template"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "alembic" },
    { name = "bcrypt" },
    { name = "fastapi" },
    { name = "httpx" },
    { name = "mcp" },
    { name = "nacos-sdk-python" },
    { name = "pre-commit" },
    { name = "prometheus-client" },
    { name = "psycopg2-binary" },
    { name = "pydantic-settings" },
    { name = "pymysql" },
    { name = "python-dotenv" },
    { name = "python-json-logger" },
    { name = "redis" },
    { name = "uvicorn", extra = ["standard"] },
    { name = "zata-oidc" },
]

[package.optional-dependencies]
sandbox-docker = [
    { name = "docker" },
]
tracing = [
    { name = "opentelemetry-exporter-otlp-proto-http" },
    { name = "opentelemetry-sdk" },
]

[package.dev-dependencies]
dev = [
    { name = "fakeredis", extra = ["lua"] },
    { name = "httpx", extra = ["socks"] },
    { name = "markdown" },
    { name = "mkdocs" },
    { name = "mkdocs-git-revision-date-localized-plugin" },
    { name = "mkdocs-material" },
    { name = "mkdocstrings", extra = ["python"] },
    { name = "pre-commit" },
    { name = "pygments" },
    { name = "pylint" },
    { name = "pymdown-extensions" },
    { name = "pytest" },
    { name = "pytest-xdist" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "alembic", specifier = ">=1.18.4" },
    { name = "bcrypt", specifier = ">=4.1.0" },
    { name = "docker", marker = "extra == 'sandbox-docker'", specifier = ">=7.1,<8" },
    { name = "fastapi", specifier = ">=0.115.0" },
    { name = "httpx", specifier = ">=0.27.0" },
    { name = "mcp", specifier = ">=2.3.0,<3.0.0" },
    { name = "nacos-sdk-python", specifier = ">=3.2,<4" },
    { name = "opentelemetry-exporter-otlp-proto-http", marker = "extra == 'tracing'", specifier = ">=1.20.0" },
    { name = "opentelemetry-sdk", marker = "extra == 'tracing'", specifier = ">=1.20.0" },
    { name = "pre-commit", specifier = ">=4.5.1" },
    { name = "prometheus-client", specifier = ">=0.20.0" },
    { name = "psycopg2-binary", specifier = ">=2.9.9" },
    { name = "pydantic-settings", specifier = ">=2.0.0" },
    { name = "pymysql", specifier = ">=1.1.0" },
    { name = "python-dotenv", specifier = ">=1.1.0" },
    { name = "python-json-logger", specifier = ">=2.0.7" },
    { name = "redis", specifier = ">=5.0.0" },
    { name = "uvicorn", extras = ["standard"], specifier = ">=0.30.0" },
    { name = "zata-oidc", directory = "packages/oidc-client" },
]
provides-extras = ["sandbox-docker", "tracing"]

[package.metadata.requires-dev]
dev = [
    { name = "fakeredis", extras = ["lua"], specifier = ">=2.21.0" },
    { name = "httpx", extras = ["socks"], specifier = ">=0.27.0" },
    { name = "markdown", specifier = ">=3.10.0" },
    { name = "mkdocs", specifier = ">=1.6.1" },
    { name = "mkdocs-git-revision-date-localized-plugin", specifier = ">=1.4.5" },
    { name = "mkdocs-material", specifier = ">=9.6.0" },
    { name = "mkdocstrings", extras = ["python"], specifier = ">=0.30.0" },
    { name = "pre-commit", specifier = ">=4.5.1" },
    { name = "pygments", specifier = ">=2.17.0" },
    { name = "pylint", specifier = ">=3.2.0" },
    { name = "pymdown-extensions", specifier = ">=10.14" },
    { name = "pytest", specifier = ">=8.3.0" },
    { name = "pytest-xdist", specifier = ">=3.6.0" },
    { name = "ruff", specifier = "==0.7.4" },
]

[[package]]
name = "zata-oidc"
version = "0.1.0"
source = { directory = "packages/oidc-client" }
dependencies = [
    { name = "httpx" },
    { name = "joserfc" },
]

[package.metadata]
requires-dist = [
    { name = "httpx", specifier = ">=0.27.0" },
    { name = "joserfc", specifier = ">=1.8.0" },
    { name = "pytest", marker = "extra == 'test'", specifier = ">=8.3.0" },
]
provides-extras = ["test"]
