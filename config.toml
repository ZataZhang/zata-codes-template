# =============================================================================
# Configuration File - Non-Sensitive Defaults
# =============================================================================
# This file contains non-sensitive configuration defaults organized by section.
# Sensitive values (passwords, API keys) should be set in .env file.
#
# To override any value, either:
# 1. Set the corresponding environment variable (highest priority)
# 2. Modify this file
# 3. Accept the code default (lowest priority)
# =============================================================================

# =============================================================================
# Application Settings
# =============================================================================
[app]
app_name = "my-app"
log_level = "INFO"

# =============================================================================
# Template Sync Settings
# =============================================================================
[template_sync]
# Project-level paths skipped by `just sync-template --all`.
#
# Default mode (`just sync-template` with no flags) only shows upstream-owned
# files (justfile.shared, scripts/shared/*, scripts/build/*, tool configs like
# pytest.ini/ruff.toml/.pre-commit-config.yaml, hooks/shared/*.py, E2E
# infrastructure, etc.) - see `_is_upstream_owned` in
# scripts/shared/template/sync_template.sh. AI adapter files (docs/ai-standards/,
# .github/copilot-instructions.md, .github/instructions/, .cursor/commands/,
# AGENTS.md, CLAUDE.md) are excluded from default mode and only appear in --all.
# The list below is irrelevant in default mode.
#
# --all mode additionally surfaces these project-level paths so you can decide
# which to bring into your fork. Add new project-owned directories here so
# the TUI stays focused on real conflicts.
project_skip_paths = [
    "src/backend/",
    "frontend-admin/",
    "frontend-public/",
    "docs/",
    "tests/",
    # E2E support and specs are project-owned; generic infrastructure stays upstream-owned.
    "tests/playwright-e2e/tests/",
    "apps/",
    "services/",
    "infra/",
    "deploy/",
    "helm/",
    "terraform/",
    "ansible/",
    "data/",
    "uploads/",
    "artifacts/",
    "tmp/",
]

# Paths that should stay visible even if they match `project_skip_paths`.
project_include_paths = []

# =============================================================================
# Database Settings (PostgreSQL)
# =============================================================================
[database]
backend = "postgresql"
host = "localhost"
port = 5432
name = "app_database"
driver = "psycopg2"

# =============================================================================
# Sandbox Execution Backend (optional)
# =============================================================================
# 整段可选。**未配置 `[sandbox_agent]` 段时沙箱后端不注册**：`build_sandbox_provider()`
# 返回 None，调用方在装配期即拿到"没有沙箱可执行面"的明确结果，而不是运行到一半才失败。
#
# 三档 provider：
#   - filesystem : 只提供隔离的会话目录，**不执行命令**（execute 直接拒绝，不静默回落
#                  到宿主执行）；适合纯文件任务与本地开发。
#   - docker     : 每会话一个受限容器；需要宿主能访问 Docker daemon，并安装
#                  `--extra sandbox-docker`。
#   - e2b        : 每会话一个 E2B Firecracker 沙箱；可连接阿里云云沙箱或本地 E2B Embed。
#
# 启用即取消注释并按需调整。docker 档的隔离参数（不注入宿主环境变量、不挂载宿主目录
# 与 Docker socket、以 uid 65534 运行、cap_drop=ALL、no-new-privileges、限制内存/CPU/
# 进程数）是安全边界，不是可调项。详见 docs/guides/sandbox-runtime.md。
#
# [sandbox_agent]
# provider = "docker"
# image = "zata-sandbox:latest"
# command_timeout_seconds = 120
# memory_limit = "1g"
# # 仅 filesystem 档使用；其余档忽略。
# workspace_root = "sandbox-workspace"
# # 可信宿主 Skill 来源目录；为空（默认）表示不暴露任何 Skill。只有消费 Skill 运行
# # 资产的执行器装配后才生效；声明了不存在的目录会在启动期 fail-fast。
# skills_paths = []
#
# [sandbox_agent.egress]
# # 三档：none 完全断网 / allowlist 按域名放行（默认）/ open 直连外网（仅本地开发）。
# # allowlist 档要求 proxy_url、network_name 与非空 allowed_domains，缺一即启动期失败。
# mode = "allowlist"
# proxy_url = "http://zata-sandbox-egress-proxy:3128"
# network_name = "zata-sandbox-egress"
# allowed_domains = ["pypi.tuna.tsinghua.edu.cn"]
#
# E2B 连接别名常驻于配置中，但不会默认启用。设置 .env.local 中的
# SANDBOX_AGENT_PROVIDER=e2b 后，应用通过 E2B 控制面创建真实 Firecracker 沙箱。
# 本地 Embed 的 api_url/sandbox_url/template_id 由 .env.local 覆盖；E2B_API_KEY
# 只存实际密钥。云端可移除相应覆盖或设置为云端地址与自建模板。
[sandbox_agent.e2b]
provider_env = "SANDBOX_AGENT_PROVIDER"
api_url = "https://api.cn-beijing.e2b.fc.aliyuncs.com"
api_url_env = "E2B_API_URL"
api_key_env = "E2B_API_KEY"
template_id = "zata-sandbox"
template_id_env = "E2B_TEMPLATE_ID"
sandbox_url_env = "E2B_SANDBOX_URL"
timeout_seconds = 900
username = "user"
allow_internet_access = false

# =============================================================================
[observability]
enabled = true
metrics_enabled = true
request_id_enabled = true
log_format = "text"
service_name = "my-app-backend"
service_version = "0.1.0"
deployment_environment = "development"

# Run 执行轨迹的 OTLP 导出参数（非密钥默认值）。Trace URL 属于可能携带凭据的
# 部署值，不放这里，只用 .env 的 OTEL_EXPORTER_OTLP_TRACES_ENDPOINT /
# OTEL_EXPORTER_OTLP_ENDPOINT 声明；未设置时完全不装配 exporter。
otlp_export_timeout_seconds = 10.0
otlp_export_batch_size = 512
otlp_export_schedule_delay_ms = 5000
