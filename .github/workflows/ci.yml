name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    # 异常挂起时自动失败，避免吃满默认 6 小时上限并烧掉托管分钟配额
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend-admin/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          # 两个前端已合并为根目录 pnpm workspace，锁文件只有根目录这一份
          cache-dependency-path: pnpm-lock.yaml

      # 纯静态 JSON 校验，不需要先装依赖；放在最前面让缺 key 秒级拦红。
      # 覆盖 frontend-public/messages/{en,zh}.json 与
      # frontend-admin/src/locales/{en,zh}.json 两对文案文件的 key 对齐。
      - name: Check i18n message key alignment
        working-directory: ${{ github.workspace }}
        run: node scripts/check-i18n-keys.mjs

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Generate "what's new" manifest
        working-directory: ${{ github.workspace }}
        run: uv run python scripts/build/build_whats_new_manifest.py --output frontend-admin/public/versions.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # job 级 defaults 把 working-directory 固定成 frontend-admin，所以下面
      # 两组步骤各自显式指定目录，避免"Frontend Build"实际只构建后台的歧义。
      - name: Type check (frontend-admin)
        run: pnpm run typecheck

      - name: Build (frontend-admin)
        run: pnpm run build

      # 公开站此前完全没有类型检查和构建门禁（Next.js 项目，Turbopack）。
      # 11 条路由在构建期全部是 Dynamic（ƒ），不会预渲染时调后端，
      # 因此这里不需要起后端即可安全构建。
      - name: Type check (frontend-public)
        working-directory: frontend-public
        run: pnpm run typecheck

      - name: Build (frontend-public)
        working-directory: frontend-public
        run: pnpm run build

  validate-template:
    name: Validate Template (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: PostgreSQL
            database_url: postgresql+psycopg2://postgres@localhost:5432/app_database
          - database: MySQL
            database_url: mysql+pymysql://root:root@localhost:3306/app_database
    services:
      # 两个服务与 job matrix 对应：每个 matrix job 对自己的数据库运行迁移和测试。
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app_database
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app_database
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies from lock file
        run: uv sync --all-extras --all-groups --frozen

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Check max file lines (hard limit)
        # 白名单是可选的，且刻意放在项目自有的 hooks/（不是上游维护的
        # hooks/shared/），这样各下游仓库的存量豁免条目不会被模板同步覆盖。
        # 文件不存在时不传该参数，没有白名单的仓库行为完全不变。
        run: |
          allow_list_file=hooks/max_file_lines.allowlist.txt
          allow_list_args=()
          if [ -f "$allow_list_file" ]; then
            allow_list_args=(--allow-list-file "$allow_list_file")
            echo "using allow-list: $allow_list_file"
          fi
          uv run python hooks/shared/check_max_file_lines.py \
            --max-lines 1000 --glob "*.py" src/backend "${allow_list_args[@]}"

      - name: Apply database migrations
        # xdist worker 各自 import backend.main，模块顶层会触发 create_app() ->
        # run_migrations()，并发 CREATE TABLE alembic_version 会 unique violation。
        # 先在这里把 schema 升到 head，worker 进入 run_migrations() 时 alembic
        # 看到 alembic_version 已存在且为 head，会直接 no-op，从而打破竞争。
        env:
          DATABASE_URL: ${{ matrix.database_url }}
        run: uv run alembic upgrade head

      - name: Run local test suite
        # Matches the default addopts filters in pyproject.toml.
        env:
          # 显式指向当前 matrix job 的真实数据库服务。
          DATABASE_URL: ${{ matrix.database_url }}
        run: uv run pytest tests/ -v -m "not slow and not real_api and not redis"

      - name: Build documentation
        run: uv run mkdocs build --strict

      - name: Build template release archive
        run: uv run python scripts/shared/release.py

      - name: Locate release archive
        id: release_archive
        run: |
          shopt -s nullglob
          release_archives=(dist/*.zip)
          if [ "${#release_archives[@]}" -ne 1 ]; then
            echo "Expected exactly one release archive, found ${#release_archives[@]}."
            exit 1
          fi
          echo "release_archive_path=${release_archives[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload release smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: template-release-${{ github.sha }}
          path: ${{ steps.release_archive.outputs.release_archive_path }}
          if-no-files-found: error
          # 每次 push 都会生成一份纯冒烟产物，保留过久会吃满账户的
          # Actions 存储配额；正式发布物走 cd.yml + GitHub Releases，
          # 不受此处影响。retention-days 仅作 prune 步骤失败时的兜底。
          retention-days: 3

      - name: Prune old template-release artifacts (keep latest 3)
        # 数量封顶：无论 CI 频率多高，同前缀制品只保留最新 3 份。
        # 按天数保留在高频 CI 下仍会累积吃满账户存储配额，故上传后
        # 立即按数量裁剪；本步骤失败不影响 CI 结论。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | select(.expired==false) | select(.name | startswith("template-release-")) | "\(.created_at)\t\(.id)"' \
            | sort -r | tail -n +4 | cut -f2 \
            | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"

  e2e:
    name: Playwright E2E (no-auth)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend-public/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            tests/playwright-e2e/pnpm-lock.yaml

      - name: Install frontend-public dependencies
        working-directory: frontend-public
        run: pnpm install --frozen-lockfile

      - name: Install Playwright dependencies and browsers
        working-directory: tests/playwright-e2e
        run: |
          # 该目录位于根 pnpm workspace 树内但不是 workspace 成员；
          # 不加 --ignore-workspace 时 pnpm 会改为操作根 workspace 而不安装本包依赖
          pnpm install --frozen-lockfile --ignore-workspace
          pnpm exec playwright install chromium

      - name: Start frontend-public dev server
        working-directory: frontend-public
        run: |
          pnpm run dev --hostname 127.0.0.1 --port 3000 > frontend.log 2>&1 &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for frontend dev server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/login >/dev/null 2>&1; then
              echo "Frontend dev server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend dev server failed to start"
          cat frontend-public/frontend.log
          exit 1

      # 后台（frontend-admin）是独立的前端域：i18n 的 no-auth 用例要在后台登录页
      # 上验证语言切换、localStorage 持久化与插值文案，因此这里也要把它跑起来。
      # 登录页不依赖后端接口（`/api` 代理不可用时页面照常渲染），所以只起
      # Vite dev server，不启动后端。
      - name: Start frontend-admin dev server
        working-directory: frontend-admin
        run: |
          pnpm run dev --host 127.0.0.1 --port 5173 > admin.log 2>&1 &
          echo "ADMIN_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for frontend-admin dev server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173/ >/dev/null 2>&1; then
              echo "Frontend admin dev server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend admin dev server failed to start"
          cat frontend-admin/admin.log
          exit 1

      - name: Run Playwright no-auth tests
        working-directory: tests/playwright-e2e
        env:
          PLAYWRIGHT_SKIP_STACK_BOOT: "1"
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3000"
          # 后台 i18n 用例通过 PLAYWRIGHT_ADMIN_BASE_URL 定位后台；不设置时
          # support/env.ts 会回退到 http://localhost:5173，与上面起的端口一致。
          PLAYWRIGHT_ADMIN_BASE_URL: "http://127.0.0.1:5173"
          # The no-auth smoke tests only require the two frontends in this job;
          # the backend is not started, so health-check the frontend root.
          PLAYWRIGHT_HEALTH_URL: "http://127.0.0.1:3000"
        run: pnpm exec playwright test --project=no-auth

      - name: Stop frontend dev servers
        if: always()
        run: |
          kill "$FRONTEND_PID" 2>/dev/null || true
          kill "$ADMIN_PID" 2>/dev/null || true
          wait 2>/dev/null || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            tests/playwright-e2e/playwright-report/
            tests/playwright-e2e/test-results/
            frontend-public/frontend.log
            frontend-admin/admin.log
          if-no-files-found: ignore
          # 失败诊断产物，排查窗口一周足够。
          retention-days: 7
