name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  build-release:
    name: Build Release Archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies from lock file
        run: uv sync --all-extras --all-groups --frozen

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Check max file lines (hard limit)
        run: uv run python hooks/shared/check_max_file_lines.py --max-lines 1000 --glob "*.py" src/backend

      - name: Run local test suite
        # Matches the default addopts filters in pyproject.toml.
        run: uv run pytest tests/ -v -m "not slow and not real_api and not redis"

      - name: Build documentation
        run: uv run mkdocs build --strict

      - name: Generate "what's new" manifest for the admin frontend
        run: uv run python scripts/build/build_whats_new_manifest.py --output frontend-admin/public/versions.json

      - name: Build template release archive
        run: uv run python scripts/shared/release.py

      - name: Locate release archive
        id: release_archive
        run: |
          shopt -s nullglob
          release_archives=(dist/*.zip)
          if [ "${#release_archives[@]}" -ne 1 ]; then
            echo "Expected exactly one release archive, found ${#release_archives[@]}."
            exit 1
          fi
          echo "release_archive_path=${release_archives[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: template-release-${{ github.run_id }}
          path: ${{ steps.release_archive.outputs.release_archive_path }}
          if-no-files-found: error
          # 正式发布物已挂在 GitHub Releases（附件存储不计入 Actions
          # 配额且永久保留），这份 artifact 只是工作流视图的重复副本，
          # 短保留即可。retention-days 仅作 prune 步骤失败时的兜底。
          retention-days: 7

      - name: Prune old template-release artifacts (keep latest 3)
        # 数量封顶：无论 CI 频率多高，同前缀制品只保留最新 3 份。
        # 按天数保留在高频 CI 下仍会累积吃满账户存储配额，故上传后
        # 立即按数量裁剪；本步骤失败不影响 CI 结论。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | select(.expired==false) | select(.name | startswith("template-release-")) | "\(.created_at)\t\(.id)"' \
            | sort -r | tail -n +4 | cut -f2 \
            | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"

      - name: Publish GitHub release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.release_archive.outputs.release_archive_path }}
          generate_release_notes: true

      - name: Publish workflow summary
        run: |
          {
            echo "### Template release workflow"
            echo ""
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Archive: \`${{ steps.release_archive.outputs.release_archive_path }}\`"
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              echo "- GitHub Release: published"
            else
              echo "- GitHub Release: skipped for manual workflow dispatch"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
