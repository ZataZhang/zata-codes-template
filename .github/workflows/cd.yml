name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  build-release:
    name: Build Release Archive
    runs-on: ubuntu-latest
    # job 级 permissions 会整体替换 workflow 级声明：contents:write 是发布
    # GitHub Release 需要的，actions:write 只被下面的制品清理步骤用到。
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies from lock file
        run: uv sync --all-extras --all-groups --frozen

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Check max file lines (hard limit)
        run: uv run python hooks/shared/check_max_file_lines.py --max-lines 1000 --glob "*.py" src/backend

      - name: Run local test suite
        # Matches the default addopts filters in pyproject.toml.
        run: uv run pytest tests/ -v -m "not slow and not real_api and not redis"

      - name: Build documentation
        run: uv run mkdocs build --strict

      - name: Generate "what's new" manifest for the admin frontend
        run: uv run python scripts/build/build_whats_new_manifest.py --output frontend-admin/public/versions.json

      - name: Build template release archive
        run: uv run python scripts/shared/release.py

      - name: Locate release archive
        id: release_archive
        run: |
          shopt -s nullglob
          release_archives=(dist/*.zip)
          if [ "${#release_archives[@]}" -ne 1 ]; then
            echo "Expected exactly one release archive, found ${#release_archives[@]}."
            exit 1
          fi
          echo "release_archive_path=${release_archives[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: template-release-${{ github.run_id }}
          path: ${{ steps.release_archive.outputs.release_archive_path }}
          if-no-files-found: error
          # 正式发布物已挂在 GitHub Releases（附件存储不计入 Actions
          # 配额且永久保留），这份 artifact 只是工作流视图的重复副本，
          # 短保留即可。retention-days 仅作 prune 步骤失败时的兜底。
          retention-days: 7

      - name: Prune old CI artifacts (keep latest 3 per prefix)
        # 数量封顶：无论 CI 频率多高，同前缀制品只保留最新 3 份。
        # 按天数保留在高频 CI 下仍会累积吃满账户存储配额，故上传后立即裁剪。
        # 走 REST 而不是 gh：自建 runner 上没装 gh，而旧写法 `gh api ... | xargs -r`
        # 在 `gh: command not found` 时依然以退出码 0 结束（xargs 收到空输入），
        # 于是这一步长期表现为绿灯但一个制品都没删。
        # 本步骤失败不阻断 CI 结论，但会打印 live/keep/deleted 计数，空转不再隐形。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PREFIXES: "template-release-,playwright-report-"
          ARTIFACT_KEEP: "3"
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          BASE = "{}/repos/{}/actions/artifacts".format(
              os.environ["GITHUB_API_URL"].rstrip("/"), os.environ["GITHUB_REPOSITORY"]
          )
          HEADERS = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "User-Agent": "ci-artifact-prune",
          }
          KEEP = int(os.environ.get("ARTIFACT_KEEP", "3"))
          PREFIXES = [p for p in os.environ.get("ARTIFACT_PREFIXES", "").split(",") if p]


          def call(url, method="GET"):
              request = urllib.request.Request(url, method=method, headers=HEADERS)
              with urllib.request.urlopen(request) as response:
                  return None if response.status == 204 else json.load(response)


          live = []
          page = 1
          while True:
              payload = call("{}?per_page=100&page={}".format(BASE, page))
              batch = payload["artifacts"]
              live += [a for a in batch if not a["expired"] and a["name"].startswith(tuple(PREFIXES))]
              if len(batch) < 100 or page * 100 >= payload["total_count"]:
                  break
              page += 1

          deleted = 0
          for prefix in PREFIXES:
              group = sorted(
                  (a for a in live if a["name"].startswith(prefix)),
                  key=lambda a: a["created_at"],
                  reverse=True,
              )
              for stale in group[KEEP:]:
                  try:
                      call("{}/{}".format(BASE, stale["id"]), method="DELETE")
                  except OSError as error:
                      print("::warning::删除 {} (id={}) 失败: {}".format(stale["name"], stale["id"], error))
                      continue
                  deleted += 1
                  print("pruned {} (id={})".format(stale["name"], stale["id"]))

          print("prefixes={} live={} keep={} deleted={}".format(PREFIXES, len(live), KEEP, deleted))
          PY

      - name: Publish GitHub release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.release_archive.outputs.release_archive_path }}
          generate_release_notes: true

      - name: Publish workflow summary
        run: |
          {
            echo "### Template release workflow"
            echo ""
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Archive: \`${{ steps.release_archive.outputs.release_archive_path }}\`"
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              echo "- GitHub Release: published"
            else
              echo "- GitHub Release: skipped for manual workflow dispatch"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
