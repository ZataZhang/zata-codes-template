[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zata-codes-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt>=4.1.0",
    "fastapi>=0.115.0",
    # 沙箱执行后端的云沙箱档（e2b_provider / e2b_control_plane /
    # e2b_execution_channel）在模块级 import httpx。它是运行期依赖，不是测试依赖：
    # 只留在 dev group 会让 `uv sync --no-dev` 的部署在 import 阶段就 ModuleNotFoundError。
    "httpx>=0.27.0",
    "pre-commit>=4.5.1",
    "prometheus-client>=0.20.0",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.0.0",
    "pymysql>=1.1.0",
    "python-dotenv>=1.1.0",
    "python-json-logger>=2.0.7",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
# Docker 沙箱后端（sandbox-docker）所需的 SDK。它的 import 是延迟的（函数体内），
# 因此裸 `uv sync` 装不出它也不会破坏 import；仅在启用 Docker 档时安装：
#   uv sync --extra sandbox-docker
sandbox-docker = ["docker>=7.1,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "fakeredis>=2.21.0",
    # httpx 已经在 [project.dependencies] 中作为运行期依赖声明（沙箱云后端模块级
    # import）。这里额外声明 socks extra：starlette.testclient / fastapi.testclient
    # 在 import 阶段就硬性要求 httpx，tests/ 下还直接用其 ASGITransport /
    # AsyncClient / Response，部分用例经 socks 代理。socks extra 顺带提供 socksio，
    # 因此不再单独声明后者。
    "httpx[socks]>=0.27.0",
    "pre-commit>=4.5.1",
    "pylint>=3.2.0",
    "pytest>=8.3.0",
    "pytest-xdist>=3.6.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "mkdocs-git-revision-date-localized-plugin>=1.4.5",
    "mkdocstrings[python]>=0.30.0",
    "pymdown-extensions>=10.14",
    # `just view` 的 Markdown 预览在服务端渲染。mkdocs 恰好会把 markdown 带进来，
    # 但那不是可接受的声明方式：`uv sync --no-dev` 的派生项目会静默失去预览入口
    # ——预览按钮不出现，源码高亮照旧，功能降级但不缺失。
    "markdown>=3.10.0",
    # `just view` 在服务端渲染语法高亮。显式声明而不是靠传递依赖：mkdocs-material
    # 之类的包恰好带上它时，`uv sync --no-dev` 的派生项目会静默失去高亮——查看器
    # 会降级成纯文本，功能不缺失，但"环境里恰好有"不是可接受的声明方式。
    "pygments>=2.17.0",
    "ruff==0.7.4",
]
