[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zata-codes-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt>=4.1.0",
    "fastapi>=0.115.0",
    "pre-commit>=4.5.1",
    "prometheus-client>=0.20.0",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.0.0",
    "pymysql>=1.1.0",
    "python-dotenv>=1.1.0",
    "python-json-logger>=2.0.7",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "fakeredis>=2.21.0",
    # starlette.testclient / fastapi.testclient 在 import 阶段就硬性要求 httpx，
    # tests/ 下还直接用 httpx 的 ASGITransport / AsyncClient / Response。它曾经
    # 只作为已摘除的 LLM 依赖的传递依赖被装进来，声明缺口被开发机 .venv 残留掩盖，
    # 裸 `uv sync --frozen` 的 CI 才在 collection 阶段全灭。socks extra 顺带提供
    # socksio，因此不再单独声明后者。
    "httpx[socks]>=0.27.0",
    "pre-commit>=4.5.1",
    "pylint>=3.2.0",
    "pytest>=8.3.0",
    "pytest-xdist>=3.6.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "mkdocs-git-revision-date-localized-plugin>=1.4.5",
    "mkdocstrings[python]>=0.30.0",
    "pymdown-extensions>=10.14",
    # `just view` 的 Markdown 预览在服务端渲染。mkdocs 恰好会把 markdown 带进来，
    # 但那不是可接受的声明方式：`uv sync --no-dev` 的派生项目会静默失去预览入口
    # ——预览按钮不出现，源码高亮照旧，功能降级但不缺失。
    "markdown>=3.10.0",
    # `just view` 在服务端渲染语法高亮。显式声明而不是靠传递依赖：mkdocs-material
    # 之类的包恰好带上它时，`uv sync --no-dev` 的派生项目会静默失去高亮——查看器
    # 会降级成纯文本，功能不缺失，但"环境里恰好有"不是可接受的声明方式。
    "pygments>=2.17.0",
    "ruff==0.7.4",
]
