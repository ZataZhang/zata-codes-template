site_name: zata-codes-template

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy

plugins:
  - search
  - git-revision-date-localized:
      fallback_to_build_date: true
      strict: false
      type: date
      locale: zh
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            members_order: source
            show_source: false
            separate_signature: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed

extra_javascript:
  - https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.js
  - javascripts/mermaid.js

extra_css:
  - stylesheets/mermaid-copy.css

nav:
  - 首页: index.md
  - 快速开始: getting-started.md
  - AI 规范:
      - 概览: ai-standards/index.md
      - 架构规范: ai-standards/architecture.md
      - 代码复用规范: ai-standards/code-reuse.md
      - 命名规范: ai-standards/naming.md
      - 注释与 Docstring: ai-standards/comments-docstrings.md
      - 文档规范: ai-standards/documentation.md
      - 前端设计规范: ai-standards/frontend-design.md
      - 测试规范: ai-standards/testing.md
