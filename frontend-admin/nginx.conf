server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 启用 Gzip 压缩。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Metrics 仅供内部 Prometheus 抓取，不通过管理前端公开。
    location = /api/metrics {
        return 404;
    }
    location ^~ /api/metrics/ {
        return 404;
    }

    # API 代理到后端。
    location /api/ {
        client_max_body_size ${API_MAX_BODY_SIZE};
        # 使用变量形式，使后端容器重建后 Nginx 可以重新解析其服务名。
        resolver 127.0.0.11 ipv6=off valid=5s;
        set $backend_upstream ${BACKEND_UPSTREAM};
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A2A 是服务间协议入口，保留规范 /a2a 前缀。
    location /a2a/ {
        resolver 127.0.0.11 ipv6=off valid=5s;
        set $backend_upstream ${BACKEND_UPSTREAM};
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 为 TanStack Router / BrowserRouter 提供客户端路由回退。
    # 注意：若某个 SPA 路由（如 /help）与镜像里的真实目录重名且目录内没有 index.html，
    # `$uri/` 会命中该目录并返回 403，而不会回落到 /index.html。
    # 此时需为该前缀单独加 `location ~ ^/help(/.*)?$ { try_files /index.html =404; }`，
    # 并放在其静态文件规则（如 .md）之后（正则 location 按书写顺序匹配）。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源使用长期缓存。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
