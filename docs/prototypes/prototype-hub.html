<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prototype Hub</title>
    <style>
      * { box-sizing: border-box; }
      :root { --ink:#182033; --muted:#6d7588; --line:#e5e8ef; --accent:#6758ef; --soft:#f5f5fb; }
      body { margin:0; min-width:320px; min-height:100vh; color:var(--ink); background:#eef0f5; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
      button,a { font:inherit; }
      button { cursor:pointer; }
      .shell { display:grid; grid-template-columns:310px minmax(0,1fr); min-height:100vh; }
      .catalog { padding:28px 22px; border-right:1px solid var(--line); background:#fff; }
      .brand { display:flex; align-items:center; gap:12px; }
      .brand-mark { display:grid; width:38px; height:38px; place-items:center; border-radius:11px; color:#fff; background:linear-gradient(145deg,#8174ff,#5140e8); font-weight:800; box-shadow:0 9px 20px #6658ef3b; }
      h1 { margin:0; font-size:20px; letter-spacing:-.03em; }
      .intro { margin:18px 0 24px; color:var(--muted); font-size:12px; line-height:1.7; }
      .label { margin:0 0 9px; color:#989fae; font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
      .prototype-list { display:grid; gap:10px; }
      .prototype-card { width:100%; padding:14px; border:1px solid var(--line); border-radius:12px; color:var(--ink); background:#fff; text-align:left; transition:.18s ease; }
      .prototype-card:hover { border-color:#c9c4fb; transform:translateY(-1px); }
      .prototype-card.active { border-color:#a99ff8; background:#f5f3ff; box-shadow:0 6px 18px #6758ef15; }
      .prototype-card strong { display:block; font-size:13px; }
      .prototype-card span { display:block; margin-top:5px; color:var(--muted); font-size:10px; line-height:1.5; }
      .tags { display:flex; gap:5px; margin-top:10px; }
      .tag { display:inline-flex!important; margin:0!important; padding:4px 7px; border-radius:999px; color:#5548c9!important; background:#e9e6ff; font-size:9px!important; font-weight:700; }
      .catalog-footer { margin-top:24px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:10px; line-height:1.6; }
      .stage { display:flex; min-width:0; flex-direction:column; padding:18px; }
      .stage-toolbar { display:flex; align-items:center; min-height:52px; padding:0 15px; border:1px solid var(--line); border-bottom:0; border-radius:13px 13px 0 0; background:#fff; }
      .stage-title strong,.stage-title span { display:block; }
      .stage-title strong { font-size:12px; }
      .stage-title span { margin-top:3px; color:var(--muted); font-size:10px; }
      .stage-actions { display:flex; gap:8px; margin-left:auto; }
      .action { border:1px solid var(--line); border-radius:8px; padding:7px 10px; color:#4e5669; background:#fff; font-size:11px; text-decoration:none; }
      .action:hover { background:var(--soft); }
      .viewport { position:relative; min-height:0; flex:1; overflow:hidden; border:1px solid var(--line); border-radius:0 0 13px 13px; background:#fff; box-shadow:0 20px 60px #2830471c; }
      iframe { display:block; width:100%; height:100%; min-height:760px; border:0; background:#fff; }
      @media(max-width:850px){ .shell{display:block}.catalog{border-right:0;border-bottom:1px solid var(--line)}.prototype-list{grid-template-columns:repeat(2,minmax(0,1fr))}.stage{height:850px} }
      @media(max-width:560px){ .prototype-list{grid-template-columns:1fr}.stage{padding:8px}.stage-title span{display:none}.action.secondary{display:none} }
    </style>
  </head>
  <body>
    <main class="shell">
      <aside class="catalog">
        <div class="brand"><span class="brand-mark">P</span><div><h1>Prototype Hub</h1><div style="margin-top:3px;color:#8a91a1;font-size:10px">zata_code_template</div></div></div>
        <p class="intro">所有可用原型集中在这里。选择左侧卡片后，可以在右侧直接操作，无需打开分离的截图或文件。</p>
        <p class="label">Available prototypes</p>
        <div class="prototype-list" id="prototypeList"></div>
        <div class="catalog-footer">验证层级：Interactive prototype / component preview。原型中的模拟行为不代表生产功能已经完成。</div>
      </aside>
      <section class="stage">
        <header class="stage-toolbar">
          <div class="stage-title"><strong id="stageTitle"></strong><span id="stageDescription"></span></div>
          <div class="stage-actions"><a class="action secondary" href="index.md">查看说明</a><a class="action" id="openStandalone" target="_blank" rel="noreferrer">新窗口打开 ↗</a></div>
        </header>
        <div class="viewport"><iframe id="prototypeFrame" title="当前交互原型"></iframe></div>
      </section>
    </main>
    <script>
      const prototypes = [
        { id:'admin-users', title:'后台用户管理', description:'搜索、筛选、详情抽屉与启用/禁用流程', url:'admin-users-interactive.html', tags:['Code-native','Interactive'] },
        { id:'ai-image-users', title:'AI 生成图片 · 用户管理', description:'ImageGen 生成四张界面，通过透明热点连接', url:'admin-users-ai-image-hotspot.html', tags:['AI-generated','Hotspots'] },
        { id:'worktree', title:'Worktree 依赖策略', description:'选择依赖模式并模拟创建与启动流程', url:'worktree-frontend-demo.html', tags:['Code-native','Interactive'] },
      ]
      const list = document.querySelector('#prototypeList')
      const frame = document.querySelector('#prototypeFrame')
      const title = document.querySelector('#stageTitle')
      const description = document.querySelector('#stageDescription')
      const standalone = document.querySelector('#openStandalone')

      function selectPrototype(id, replace = false) {
        const target = prototypes.find((prototype) => prototype.id === id) || prototypes[0]
        frame.src = target.url
        title.textContent = target.title
        description.textContent = target.description
        standalone.href = target.url
        document.querySelectorAll('[data-prototype]').forEach((button) => button.classList.toggle('active', button.dataset.prototype === target.id))
        const url = new URL(window.location.href)
        url.searchParams.set('prototype', target.id)
        window.history[replace ? 'replaceState' : 'pushState']({}, '', url)
      }

      list.innerHTML = prototypes.map((prototype) => `<button class="prototype-card" type="button" data-prototype="${prototype.id}"><strong>${prototype.title}</strong><span>${prototype.description}</span><span class="tags">${prototype.tags.map((tag) => `<span class="tag">${tag}</span>`).join('')}</span></button>`).join('')
      list.addEventListener('click', (event) => {
        const card = event.target.closest('[data-prototype]')
        if (card) selectPrototype(card.dataset.prototype)
      })
      window.addEventListener('popstate', () => selectPrototype(new URL(window.location.href).searchParams.get('prototype'), true))
      selectPrototype(new URL(window.location.href).searchParams.get('prototype'), true)
    </script>
  </body>
</html>
