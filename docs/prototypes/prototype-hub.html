<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>原型目录 · Prototype Hub</title>
<link rel="stylesheet" href="./shared.css">
<link rel="stylesheet" href="./hub.css">
</head>
<body>
<main class="shell">
  <aside class="sidebar">
    <a class="brand" href="./prototype-hub.html"><span>P</span>原型目录</a>
    <nav class="nav" aria-label="原型资产分类">
      <button type="button" class="active" data-filter="all" data-label="全部原型">全部原型 <b data-total>0</b></button>
      <button type="button" data-filter="code-native" data-label="交互原型">交互原型 <b data-count-code>0</b></button>
      <button type="button" data-filter="image-state" data-label="图片原型">图片原型 <b data-count-image>0</b></button>
      <button type="button" data-filter="available" data-label="当前可用">当前可用 <b data-count-available>0</b></button>
      <span class="nav-group">辅助入口</span>
      <a href="./index.md">原型规范</a>
    </nav>
    <div class="sidebar-footer">
      <a class="secondary-entry" href="../ai-standards/index.md">研发规范</a>
      <small>Hub 只管理原型资产与入口，不承载 PRD 执行状态、Issue、CI/CD 或运行监控。</small>
    </div>
  </aside>

  <section class="main">
    <header class="page-header">
      <div>
        <span class="eyebrow">Prototype library</span>
        <h1 data-heading>全部原型</h1>
        <p>点击缩略图或名称直接打开原型（新标签）；点击行内其他区域在右侧查看详情与来源。</p>
      </div>
      <label class="search">⌕ <input id="search" placeholder="搜索原型" aria-label="搜索原型"></label>
    </header>

    <section class="toolbar">
      <select id="project" aria-label="按项目筛选"><option value="all">全部项目</option></select>
      <select id="module" aria-label="按模块筛选"><option value="all">全部模块</option></select>
      <select id="form" aria-label="按原型形式筛选">
        <option value="all">全部形式</option>
        <option value="code-native">交互原型</option>
        <option value="image-state">图片原型</option>
      </select>
      <select id="availability" aria-label="按可用状态筛选">
        <option value="all">全部状态</option>
        <option value="available">可用</option>
        <option value="unavailable">不可用</option>
      </select>
    </section>

    <div class="content">
      <div class="hub-layout">
        <section class="content-scroll">
          <div class="panel">
            <table class="catalog">
              <thead>
                <tr><th>预览</th><th>原型名称</th><th>项目</th><th>模块</th><th>形式</th><th>更新时间</th><th>状态</th></tr>
              </thead>
              <tbody id="catalog"></tbody>
            </table>
            <div id="empty" class="empty" hidden>没有匹配的原型，试试清空搜索或筛选。</div>
          </div>
        </section>
        <aside id="detail" class="detail" aria-label="原型详情"></aside>
      </div>
    </div>
  </section>
</main>

<script src="./prototype-registry.js"></script>
<script src="./hub.js"></script>
</body>
</html>
