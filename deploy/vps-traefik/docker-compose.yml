# -----------------------------------------------------------------------------
# Docker Compose — VPS + Traefik Production Deployment
# -----------------------------------------------------------------------------
# This compose file is intended for /opt/apps/zata-codes-template on a server
# that already runs host-level Traefik on an external Docker network.
#
# Required files beside this compose file:
#   - .env      deployment metadata: DOMAIN, TRAEFIK_NETWORK, image refs
#   - app.env   runtime secrets and application configuration
#
# Bring up:
#   docker compose up -d
#
# Backups, S3 diagnostics, and VPS provisioning have moved to the standalone
# `zata-ops` CLI; install it and schedule `zata-ops db backup` externally.
# -----------------------------------------------------------------------------

# Traefik 部署共用外部网络，以 Compose 项目名为后端生成专属网络别名。
x-backend-network-alias: &backend-network-alias
  "${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}-backend"
x-backend-upstream: &backend-upstream
  "${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}-backend:8000"

services:
  zata-codes-template-backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in .env}
    pull_policy: always
    expose:
      - "8000"
    env_file:
      - app.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - FORWARDED_ALLOW_IPS=*
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}
      - OBSERVABILITY_ENABLED=${OBSERVABILITY_ENABLED:-true}
      - OBSERVABILITY_REQUEST_ID_ENABLED=${OBSERVABILITY_REQUEST_ID_ENABLED:-true}
      - OBSERVABILITY_LOG_FORMAT=${OBSERVABILITY_LOG_FORMAT:-text}
      - OBSERVABILITY_SERVICE_NAME=${OBSERVABILITY_SERVICE_NAME:-zata-codes-template-backend}
      - OBSERVABILITY_SERVICE_VERSION=${OBSERVABILITY_SERVICE_VERSION:-0.1.0}
      - OBSERVABILITY_DEPLOYMENT_ENVIRONMENT=${OBSERVABILITY_DEPLOYMENT_ENVIRONMENT:-production}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # 启动窗口必须覆盖真实启动耗时，否则下方 admin / public 的 depends_on:
      # service_healthy 会在 backend 就绪前判定失败，整组发布中断，而回滚同样
      # 撞这面墙。10s + 3×30s 只有约 70s 预算，对需要跑 alembic 迁移、seed 数据
      # 或连接远程/跨境数据库的部署明显不够（派生项目实测启动耗时 71~95s）。
      # start_period 内的失败不计入 retries，容器保持 starting，因此放宽它不会
      # 掩盖真正的启动失败，只是把发现时间从 70s 推迟到 180s。
      start_period: 180s
    volumes:
      - zata-codes-template-backend-logs:/app/logs
      - zata-codes-template-backend-data:/app/data
    networks:
      backend-app:
        aliases:
          - *backend-network-alias
    labels:
      - "com.docker.compose.project=zata-codes-template"
      - "com.docker.compose.service=backend"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "0.25"
          memory: 512M

  zata-codes-template-admin:
    image: ${ADMIN_IMAGE:?Set ADMIN_IMAGE in .env}
    pull_policy: always
    expose:
      - "80"
    depends_on:
      zata-codes-template-backend:
        condition: service_healthy
    environment:
      BACKEND_UPSTREAM: *backend-upstream
      API_MAX_BODY_SIZE: ${ADMIN_API_MAX_BODY_BYTES:-1048576}
    restart: unless-stopped
    networks:
      - traefik
      - backend-app
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.middlewares.zata-codes-template-admin-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.zata-codes-template-admin-web.rule=Host(`admin.${DOMAIN:?Set DOMAIN in .env}`)"
      - "traefik.http.routers.zata-codes-template-admin-web.entrypoints=web"
      - "traefik.http.routers.zata-codes-template-admin-web.middlewares=zata-codes-template-admin-https-redirect"
      - "traefik.http.routers.zata-codes-template-admin.rule=Host(`admin.${DOMAIN:?Set DOMAIN in .env}`)"
      - "traefik.http.routers.zata-codes-template-admin.entrypoints=websecure"
      - "traefik.http.routers.zata-codes-template-admin.tls=true"
      - "traefik.http.routers.zata-codes-template-admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.zata-codes-template-admin.loadbalancer.server.port=80"
      - "traefik.http.middlewares.zata-codes-template-admin-api-rate.ratelimit.average=${ADMIN_API_RATE_LIMIT_AVERAGE:-60}"
      - "traefik.http.middlewares.zata-codes-template-admin-api-rate.ratelimit.period=${ADMIN_API_RATE_LIMIT_PERIOD:-1m}"
      - "traefik.http.middlewares.zata-codes-template-admin-api-rate.ratelimit.burst=${ADMIN_API_RATE_LIMIT_BURST:-20}"
      - "traefik.http.middlewares.zata-codes-template-admin-api-rate.ratelimit.sourcecriterion.ipstrategy.depth=${TRAEFIK_CLIENT_IP_DEPTH:-0}"
      - "traefik.http.middlewares.zata-codes-template-admin-api-inflight.inflightreq.amount=${ADMIN_API_MAX_INFLIGHT:-20}"
      - "traefik.http.middlewares.zata-codes-template-admin-api-body.buffering.maxrequestbodybytes=${ADMIN_API_MAX_BODY_BYTES:-1048576}"
      - "traefik.http.middlewares.zata-codes-template-admin-api-body.buffering.memrequestbodybytes=${ADMIN_API_MAX_BODY_BYTES:-1048576}"
      - "traefik.http.routers.zata-codes-template-admin-api.rule=Host(`admin.${DOMAIN:?Set DOMAIN in .env}`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.zata-codes-template-admin-api.entrypoints=websecure"
      - "traefik.http.routers.zata-codes-template-admin-api.priority=100"
      - "traefik.http.routers.zata-codes-template-admin-api.tls=true"
      - "traefik.http.routers.zata-codes-template-admin-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.zata-codes-template-admin-api.middlewares=zata-codes-template-admin-api-rate,zata-codes-template-admin-api-inflight,zata-codes-template-admin-api-body"
      - "traefik.http.routers.zata-codes-template-admin-api.service=zata-codes-template-admin"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.125"
          memory: 64M

  zata-codes-template-public:
    image: ${PUBLIC_IMAGE:?Set PUBLIC_IMAGE in .env}
    pull_policy: always
    expose:
      - "3000"
    env_file:
      - app.env
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}-backend:8000}
    depends_on:
      zata-codes-template-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - traefik
      - backend-app
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.middlewares.zata-codes-template-public-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.zata-codes-template-public-web.rule=Host(`${DOMAIN:?Set DOMAIN in .env}`)"
      - "traefik.http.routers.zata-codes-template-public-web.entrypoints=web"
      - "traefik.http.routers.zata-codes-template-public-web.middlewares=zata-codes-template-public-https-redirect"
      - "traefik.http.routers.zata-codes-template-public.rule=Host(`${DOMAIN:?Set DOMAIN in .env}`)"
      - "traefik.http.routers.zata-codes-template-public.entrypoints=websecure"
      - "traefik.http.routers.zata-codes-template-public.tls=true"
      - "traefik.http.routers.zata-codes-template-public.tls.certresolver=letsencrypt"
      - "traefik.http.services.zata-codes-template-public.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.zata-codes-template-public-api-rate.ratelimit.average=${PUBLIC_API_RATE_LIMIT_AVERAGE:-120}"
      - "traefik.http.middlewares.zata-codes-template-public-api-rate.ratelimit.period=${PUBLIC_API_RATE_LIMIT_PERIOD:-1m}"
      - "traefik.http.middlewares.zata-codes-template-public-api-rate.ratelimit.burst=${PUBLIC_API_RATE_LIMIT_BURST:-60}"
      - "traefik.http.middlewares.zata-codes-template-public-api-rate.ratelimit.sourcecriterion.ipstrategy.depth=${TRAEFIK_CLIENT_IP_DEPTH:-0}"
      - "traefik.http.middlewares.zata-codes-template-public-api-inflight.inflightreq.amount=${PUBLIC_API_MAX_INFLIGHT:-40}"
      - "traefik.http.middlewares.zata-codes-template-public-api-body.buffering.maxrequestbodybytes=${PUBLIC_API_MAX_BODY_BYTES:-1048576}"
      - "traefik.http.middlewares.zata-codes-template-public-api-body.buffering.memrequestbodybytes=${PUBLIC_API_MAX_BODY_BYTES:-1048576}"
      - "traefik.http.routers.zata-codes-template-public-api.rule=Host(`${DOMAIN:?Set DOMAIN in .env}`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.zata-codes-template-public-api.entrypoints=websecure"
      - "traefik.http.routers.zata-codes-template-public-api.priority=100"
      - "traefik.http.routers.zata-codes-template-public-api.tls=true"
      - "traefik.http.routers.zata-codes-template-public-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.zata-codes-template-public-api.middlewares=zata-codes-template-public-api-rate,zata-codes-template-public-api-inflight,zata-codes-template-public-api-body"
      - "traefik.http.routers.zata-codes-template-public-api.service=zata-codes-template-public"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.125"
          memory: 64M

volumes:
  zata-codes-template-backend-logs:
  zata-codes-template-backend-data:

networks:
  backend-app: {}
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
