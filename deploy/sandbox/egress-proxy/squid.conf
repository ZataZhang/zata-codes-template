# 沙箱出站代理：按域名放行，清单外一律拒绝，每次出站留日志。
#
# 沙箱容器接入 internal 网络后无法直连外网，只能经本代理出站。放行清单是安全边界，
# 沙箱容器没有修改它的路径——清单只随本文件部署，容器内无写权限。
#
# 审计限制：出站流量加密，本代理只记录目标域名，无法识别具体包名或请求路径。
# 包级审计需要在执行侧另做安装差异记录（比对容器内已安装包与镜像基线），不依赖本代理。

http_port 3128

# 沙箱容器所在的 internal 网络。网段由 Docker 自动分配（宿主上通常已有多个项目占用
# 固定网段），这里按私有地址段放行；真正限制可达性的是网络的 internal 属性——只有接入
# 该网络的沙箱容器能到达本代理。
acl sandbox_clients src 10.0.0.0/8
acl sandbox_clients src 172.16.0.0/12
acl sandbox_clients src 192.168.0.0/16

# ---------------------------------------------------------------------------
# 放行清单。新增条目须走变更审查。
#   - 清华 PyPI 镜像：索引与包文件同域，放行一项即可；改用官方源需同时放行
#     pypi.org 与 files.pythonhosted.org，放行面反而更大
#   - 业务内部服务：按派生项目实际需要追加（示例见下，按需取消注释并替换域名）
# ---------------------------------------------------------------------------
acl allowed_destinations dstdomain pypi.tuna.tsinghua.edu.cn
# acl allowed_destinations dstdomain your-internal-service.example.com

# HTTPS 经 CONNECT 出站，只允许标准 443；不开放任意端口。
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !sandbox_clients
http_access deny CONNECT !SSL_ports
http_access allow sandbox_clients allowed_destinations
http_access deny all

# 拒绝同样记日志——只记成功放行会让"agent 尝试访问了什么"不可查。
#
# 写文件而不是 /dev/stdout：squid 以 proxy 用户运行，对 /dev/stdout 无写权限
# （stdio 模块报 "Cannot open '/dev/stdout' for writing"，daemon 模块同样失败）。
# 编排把该目录挂成命名卷，排查时用 docker exec 或直接读卷。
access_log /var/log/squid/access.log squid

# 不缓存：沙箱出站量小，缓存只会让"这次到底取了什么"更难追溯。
cache deny all
