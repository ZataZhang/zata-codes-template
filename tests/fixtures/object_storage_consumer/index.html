<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Object Storage Consumer Fixture</title>
  </head>
  <body>
    <main>
      <h1>Object Storage Consumer Fixture</h1>
      <input id="file-input" type="file" accept="image/png" />
      <img id="public-image" alt="Public object delivered from CDN" />
      <output id="status"></output>
    </main>
    <script>
      const apiBaseUrl = new URLSearchParams(window.location.search).get('api')
      const statusOutput = document.querySelector('#status')
      const uploadForm = document.querySelector('#file-input')
      const publicImage = document.querySelector('#public-image')

      async function readJsonResponse(response) {
        const responseJson = await response.json()
        if (!response.ok) {
          throw new Error(`API returned ${response.status}`)
        }
        return responseJson
      }

      async function uploadFileToOss(visibility, file, identity = 'owner') {
        const uploadResponse = await fetch(`${apiBaseUrl}/api/upload-grants`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Test-Identity': identity,
          },
          body: JSON.stringify({ visibility }),
        })
        const uploadTicket = await readJsonResponse(uploadResponse)
        const fileArrayBuffer = await file.arrayBuffer()
        const fileBytes = new Uint8Array(fileArrayBuffer)
        let fileBinaryText = ''
        for (let offset = 0; offset < fileBytes.length; offset += 0x8000) {
          fileBinaryText += String.fromCharCode(...fileBytes.subarray(offset, offset + 0x8000))
        }
        const fileBase64 = btoa(fileBinaryText)
        const apiResponseContainsFileBody = JSON.stringify(uploadTicket).includes(fileBase64)
        const ossFormData = new FormData()
        for (const [fieldName, fieldValue] of Object.entries(uploadTicket.form_fields)) {
          ossFormData.append(fieldName, fieldValue)
        }
        ossFormData.append('file', file, file.name)
        const ossResponse = await fetch(uploadTicket.upload_url, {
          method: 'POST',
          body: ossFormData,
        })
        const ossResponseText = await ossResponse.text()
        if (!ossResponse.ok) {
          return {
            upload_id: uploadTicket.upload_id,
            object_key: uploadTicket.object_key,
            status: ossResponse.status,
            response_text: ossResponseText,
            api_response_contains_file_body: apiResponseContainsFileBody,
          }
        }
        const completionResponse = await fetch(`${apiBaseUrl}/api/upload-completions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Test-Identity': identity,
          },
          body: JSON.stringify({ upload_id: uploadTicket.upload_id }),
        })
        const completion = await readJsonResponse(completionResponse)
        statusOutput.textContent = `Uploaded ${completion.content_length} bytes to OSS`
        return {
          upload_id: uploadTicket.upload_id,
          object_key: uploadTicket.object_key,
          status: ossResponse.status,
          completion,
          api_response_contains_file_body: apiResponseContainsFileBody,
        }
      }

      window.objectStorageFixture = {
        async uploadSelectedFile(visibility) {
          const selectedFile = uploadForm.files?.[0]
          if (!selectedFile) {
            throw new Error('Select a PNG file first')
          }
          return uploadFileToOss(visibility, selectedFile)
        },
        async uploadOversizedControl() {
          const oversizedFile = new File(
            [new Uint8Array(65_537)],
            'oversized-control.png',
            { type: 'image/png' },
          )
          return uploadFileToOss('oversize-control', oversizedFile)
        },
        async getPublicDelivery(uploadId) {
          const deliveryResponse = await fetch(`${apiBaseUrl}/api/public-deliveries/${uploadId}`)
          return readJsonResponse(deliveryResponse)
        },
        async displayPublicImage(url) {
          publicImage.src = url
          await publicImage.decode()
          return { complete: publicImage.complete, natural_width: publicImage.naturalWidth }
        },
        async readPublicImage(url) {
          const publicResponse = await fetch(url)
          const responseBytes = await publicResponse.arrayBuffer()
          const digestBytes = await crypto.subtle.digest('SHA-256', responseBytes)
          const digestHex = Array.from(new Uint8Array(digestBytes))
            .map((byteValue) => byteValue.toString(16).padStart(2, '0'))
            .join('')
          return {
            status: publicResponse.status,
            digest_sha256: digestHex,
            cache_control: publicResponse.headers.get('cache-control'),
            age: publicResponse.headers.get('age'),
            x_cache: publicResponse.headers.get('x-cache'),
          }
        },
        async requestPrivateRead(uploadId, identity) {
          const readResponse = await fetch(`${apiBaseUrl}/api/private-read-grants`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Test-Identity': identity,
            },
            body: JSON.stringify({ upload_id: uploadId }),
          })
          const responseBody = await readResponse.json()
          return { status: readResponse.status, body: responseBody }
        },
        async readPrivateUrl(url) {
          const privateResponse = await fetch(url)
          const responseBytes = await privateResponse.arrayBuffer()
          const digestBytes = await crypto.subtle.digest('SHA-256', responseBytes)
          const digestHex = Array.from(new Uint8Array(digestBytes))
            .map((byteValue) => byteValue.toString(16).padStart(2, '0'))
            .join('')
          return { status: privateResponse.status, digest_sha256: digestHex }
        },
      }
    </script>
  </body>
</html>
